<html lang="pt-BR"><head>
<meta charset="UTF-8">
<title>Flor Laranja</title>

<style>
  body {
    margin: 0;
    background: #0f0f0f;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .flower {
    position: relative;
    width: 120px;
    height: 260px;
    transform-origin: bottom center;
  }

  /* PÉTALAS */
  .petals {
    position: relative;
    width: 120px;
    height: 120px;
  }

  .petals span {
    position: absolute;
    width: 50px;
    height: 80px;
    background: linear-gradient(180deg, #ff9a00, #ff6a00);
    border-radius: 50%;
    top: 20px;
    left: 35px;
    transform-origin: bottom center;
    box-shadow: 0 0 15px rgba(255, 122, 0, 0.4);
  }

  .petals span:nth-child(1) { transform: rotate(0deg); }
  .petals span:nth-child(2) { transform: rotate(45deg); }
  .petals span:nth-child(3) { transform: rotate(90deg); }
  .petals span:nth-child(4) { transform: rotate(135deg); }
  .petals span:nth-child(5) { transform: rotate(180deg); }
  .petals span:nth-child(6) { transform: rotate(225deg); }
  .petals span:nth-child(7) { transform: rotate(270deg); }
  .petals span:nth-child(8) { transform: rotate(315deg); }

  /* CENTRO */
  .center {
    position: absolute;
    width: 40px;
    height: 40px;
    background: radial-gradient(circle, #6b3a00, #3a1a00);
    border-radius: 50%;
    top: 40px;
    left: 40px;
    z-index: 2;
  }

  /* RAMO */
  .stem {
    position: absolute;
    width: 8px;
    height: 140px;
    background: linear-gradient(#2ecc71, #1e8449);
    left: 56px;
    top: 120px;
    border-radius: 10px;
  }

  /* FOLHAS */
  .leaf {
    position: absolute;
    width: 60px;
    height: 30px;
    background: linear-gradient(135deg, #2ecc71, #27ae60);
    border-radius: 60px 0;
    top: 170px;
  }

  .leaf.left {
    left: -25px;
    transform: rotate(-30deg);
  }

  .leaf.right {
    right: -25px;
    transform: rotate(210deg);
  }
</style>
</head>

<body>

<div class="flower" style="transform: rotate(-1.96275deg);">
  <div class="petals">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <div class="center"></div>
  <div class="stem"></div>
  <div class="leaf left"></div>
  <div class="leaf right"></div>
</div>

<script>
  const flower = document.querySelector('.flower');
  let angle = 0;

  setInterval(() => {
    angle += 0.05;
    flower.style.transform =
      `rotate(${Math.sin(angle) * 2}deg)`;
  }, 30);
</script>
