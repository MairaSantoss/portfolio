


<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flor Laranja</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: white;
        }

        svg {
            width: 300px;
            height: 300px;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.2));
        }

        .petal {
            fill: #ff9933;
            stroke: #ff6600;
            stroke-width: 2;
            animation: bloom 1.5s ease-out forwards;
            transform-origin: 150px 150px;
            opacity: 0;
        }

        .petal:nth-child(1) { animation-delay: 0s; }
        .petal:nth-child(2) { animation-delay: 0.15s; }
        .petal:nth-child(3) { animation-delay: 0.3s; }
        .petal:nth-child(4) { animation-delay: 0.45s; }
        .petal:nth-child(5) { animation-delay: 0.6s; }
        .petal:nth-child(6) { animation-delay: 0.75s; }

        .center {
            fill: #ff6600;
            animation: centerGrow 1s ease-out 0.9s forwards;
            opacity: 0;
        }

        .stem {
            stroke: #228b22;
            stroke-width: 8;
            stroke-linecap: round;
        }

        .leaf {
            fill: #32cd32;
            stroke: #228b22;
            stroke-width: 1.5;
            animation: leafAppear 1s ease-out 1.5s forwards;
            opacity: 0;
        }

        @keyframes bloom {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        @keyframes centerGrow {
            0% {
                r: 0;
                opacity: 0;
            }
            100% {
                r: 30;
                opacity: 1;
            }
        }

        @keyframes leafAppear {
            0% {
                opacity: 0;
                transform: scale(0);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
        <!-- Caule -->
        <line class="stem" x1="150" y1="180" x2="150" y2="280" />
        
        <!-- Folhas -->
        <ellipse class="leaf" cx="110" cy="220" rx="35" ry="20" transform="rotate(-45 110 220)" />
        <ellipse class="leaf" cx="190" cy="240" rx="35" ry="20" transform="rotate(45 190 240)" />
        
        <!-- Pétalas -->
        <ellipse class="petal" cx="150" cy="80" rx="25" ry="50" />
        <ellipse class="petal" cx="150" cy="80" rx="25" ry="50" transform="rotate(60 150 150)" />
        <ellipse class="petal" cx="150" cy="80" rx="25" ry="50" transform="rotate(120 150 150)" />
        <ellipse class="petal" cx="150" cy="80" rx="25" ry="50" transform="rotate(180 150 150)" />
        <ellipse class="petal" cx="150" cy="80" rx="25" ry="50" transform="rotate(240 150 150)" />
        <ellipse class="petal" cx="150" cy="80" rx="25" ry="50" transform="rotate(300 150 150)" />
        
        <!-- Centro da flor -->
        <circle class="center" cx="150" cy="150" r="0" />
    </svg>

    <script>
        // Animação contínua suave
        const svg = document.querySelector('svg');
        let time = 0;

        function animate() {
            time += 0.01;
            const sway = Math.sin(time * 0.5) * 2;
            svg.style.transform = `rotate(${sway}deg)`;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
